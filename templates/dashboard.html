<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>COMMAND CENTER — Zefoy Buff</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="min-h-screen text-slate-100 relative scanlines" style="background:#05060d">
  <div class="absolute inset-0 -z-10 bg-gradient-to-br from-[#0b0f2a] via-[#05060d] to-[#1a0426]"></div>
  <div class="absolute inset-0 -z-10 grid-bg opacity-60"></div>

  <header class="sticky top-0 z-30 glass border-b border-cyan-500/20">
    <div class="mx-auto max-w-7xl px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="hex-badge h-9 w-9 bg-gradient-to-tr from-cyan-400 to-fuchsia-500 flex items-center justify-center">
          <span class="font-display font-black text-sm">Z</span>
        </div>
        <div>
          <div class="font-display text-sm tracking-widest">ZEFOY // COMMAND</div>
          <div class="text-[10px] uppercase tracking-[.3em] text-cyan-300/70">Operator: <span class="font-mono">{{ user.id }}…</span></div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="connDot" class="flex items-center gap-2 text-xs">
          <span class="h-2 w-2 rounded-full bg-slate-500"></span>
          <span class="chip text-[10px] text-slate-400">LINK</span>
        </div>
        <button id="logoutBtn" class="text-xs font-display tracking-widest px-3 py-1.5 rounded-lg bg-white/5 hover:bg-rose-500/15 border border-white/10 hover:border-rose-400/40 transition">DISCONNECT</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 grid gap-5 lg:grid-cols-12">

    <!-- Left: session / captcha -->
    <section class="lg:col-span-4 space-y-5">
      <div class="glass neon-border rounded-2xl p-5">
        <div class="flex items-center justify-between mb-3">
          <div class="chip text-[11px] text-cyan-300">SESSION CORE</div>
          <span id="sessState" class="pill pill-queued">IDLE</span>
        </div>
        <button id="initBtn" class="w-full neon-btn rounded-lg py-2.5 font-display text-sm tracking-widest">&gt; INITIALIZE</button>
        <div class="mt-4">
          <div class="chip text-[10px] text-fuchsia-300 mb-2">CAPTCHA</div>
          <div id="captchaBox" class="rounded-lg border border-white/10 bg-black/40 min-h-[110px] flex items-center justify-center overflow-hidden">
            <span class="text-xs text-slate-500 tracking-widest">// no captcha loaded</span>
          </div>
          <div class="mt-3 flex gap-2">
            <input id="answer" placeholder="ANSWER" class="flex-1 rounded-lg bg-black/40 border border-white/10 px-3 py-2 font-mono text-sm outline-none focus:border-cyan-400">
            <button id="solveBtn" class="rounded-lg px-4 py-2 font-display text-xs tracking-widest bg-cyan-500/20 border border-cyan-500/40 hover:bg-cyan-500/30">SOLVE</button>
          </div>
          <button id="refreshCap" class="mt-2 text-[11px] text-slate-400 hover:text-cyan-300 tracking-widest">↻ refresh captcha</button>
        </div>
      </div>

      <div class="glass neon-border rounded-2xl p-5">
        <div class="chip text-[11px] text-lime-300 mb-3">STATS</div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="rounded-lg bg-white/5 border border-white/10 p-2">
            <div class="chip text-[9px] text-cyan-300">QUEUED</div>
            <div id="statQ" class="font-display text-lg mt-1">0</div>
          </div>
          <div class="rounded-lg bg-white/5 border border-white/10 p-2">
            <div class="chip text-[9px] text-fuchsia-300">RUN</div>
            <div id="statR" class="font-display text-lg mt-1">0</div>
          </div>
          <div class="rounded-lg bg-white/5 border border-white/10 p-2">
            <div class="chip text-[9px] text-lime-300">DONE</div>
            <div id="statD" class="font-display text-lg mt-1">0</div>
          </div>
        </div>
        <p class="mt-3 text-[10px] text-slate-500 tracking-widest">// Jobs chạy nền — tắt trình duyệt vẫn tiếp tục</p>
      </div>
    </section>

    <!-- Center: buff console -->
    <section class="lg:col-span-5 space-y-5">
      <div class="glass neon-border rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4">
          <div class="chip text-[11px] text-fuchsia-300">BUFF CONSOLE</div>
          <button id="reloadSvc" class="text-[11px] tracking-widest text-slate-400 hover:text-cyan-300">↻ reload services</button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="chip text-[10px] text-slate-400">SERVICE</label>
            <select id="service" class="mt-1 w-full rounded-lg bg-black/40 border border-white/10 px-3 py-2 text-sm font-mono focus:border-cyan-400 outline-none">
              <option value="">-- load services first --</option>
            </select>
          </div>
          <div>
            <label class="chip text-[10px] text-slate-400">TARGET URL</label>
            <input id="url" placeholder="https://www.tiktok.com/@user/video/..." class="mt-1 w-full rounded-lg bg-black/40 border border-white/10 px-3 py-2 font-mono text-sm focus:border-cyan-400 outline-none"/>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div class="col-span-1">
              <label class="chip text-[10px] text-slate-400">LOOPS</label>
              <input id="loops" type="number" min="1" max="500" value="5" class="mt-1 w-full rounded-lg bg-black/40 border border-white/10 px-3 py-2 font-mono text-sm focus:border-cyan-400 outline-none"/>
            </div>
            <button id="buffBtn" class="col-span-2 mt-6 neon-btn rounded-lg py-2.5 font-display text-sm tracking-widest">&gt; EXECUTE BUFF</button>
          </div>
        </div>
      </div>

      <div class="glass neon-border rounded-2xl p-5">
        <div class="flex items-center justify-between mb-3">
          <div class="chip text-[11px] text-cyan-300">TERMINAL LOG</div>
          <div class="text-[10px] text-slate-500 tracking-widest">stream</div>
        </div>
        <div id="log" class="h-56 overflow-y-auto rounded-lg bg-black/60 border border-white/10 p-3 font-mono text-[12px] leading-relaxed"></div>
      </div>
    </section>

    <!-- Right: jobs -->
    <section class="lg:col-span-3">
      <div class="glass neon-border rounded-2xl p-5 sticky top-24">
        <div class="flex items-center justify-between mb-3">
          <div class="chip text-[11px] text-lime-300">JOB QUEUE</div>
          <button id="clearJobs" class="text-[11px] text-slate-400 hover:text-rose-300 tracking-widest">CLEAR</button>
        </div>
        <div id="jobs" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1"></div>
      </div>
    </section>
  </main>

  <!-- Full-screen loader -->
  <div id="overlay" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/70 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-4">
      <div class="loader-orb"></div>
      <div id="ovMsg" class="font-display text-xs tracking-[.4em] text-cyan-300">PROCESSING…</div>
    </div>
  </div>

<script>
const $=(id)=>document.getElementById(id);
const log=$('log'), jobs=$('jobs'), ov=$('overlay'), ovMsg=$('ovMsg');
const state={ services:[], jobsMap:new Map() };

function ts(){ return new Date().toLocaleTimeString('en-GB'); }
function put(msg,cls='text-slate-300'){
  const line=document.createElement('div');
  line.className=cls;
  line.innerHTML=`<span class="text-slate-500">[${ts()}]</span> ${msg}`;
  log.appendChild(line); log.scrollTop=log.scrollHeight;
}
function showOv(m){ ovMsg.textContent=m||'PROCESSING…'; ov.classList.remove('hidden'); ov.classList.add('flex'); }
function hideOv(){ ov.classList.add('hidden'); ov.classList.remove('flex'); }

async function api(path, opts={}){
  const r=await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if(r.status===401){ location='/login'; throw new Error('unauth'); }
  return r.json();
}

$('logoutBtn').onclick=async ()=>{ await api('/api/logout',{method:'POST'}); location='/login'; };

$('initBtn').onclick=async ()=>{
  showOv('CONNECTING…'); $('sessState').className='pill pill-running'; $('sessState').textContent='LINKING';
  try{
    const j=await api('/api/init',{method:'POST'});
    if(j.ok){ put('&gt; session initialized','text-emerald-300'); $('sessState').className='pill pill-done'; $('sessState').textContent='READY'; await loadCaptcha(); await loadServices(); }
    else{ put('&gt; init failed: '+(j.error||''),'text-rose-300'); $('sessState').className='pill pill-error'; $('sessState').textContent='ERR'; }
  } finally { hideOv(); }
};

async function loadCaptcha(){
  const j=await api('/api/captcha');
  const box=$('captchaBox'); box.innerHTML='';
  if(j.ok){ const img=new Image(); img.src=j.image; img.className='max-h-32'; box.appendChild(img); }
  else{ box.innerHTML='<span class="text-xs text-rose-300">no captcha</span>'; }
}
$('refreshCap').onclick=loadCaptcha;

$('solveBtn').onclick=async ()=>{
  const answer=$('answer').value.trim(); if(!answer) return;
  showOv('VERIFYING…');
  try{
    const j=await api('/api/solve',{method:'POST',body:JSON.stringify({answer})});
    if(j.ok){ put('&gt; captcha solved','text-emerald-300'); await loadServices(); }
    else{ put('&gt; captcha wrong','text-rose-300'); await loadCaptcha(); }
  } finally { hideOv(); }
};

async function loadServices(){
  const j=await api('/api/services'); if(!j.ok) return;
  state.services=j.services;
  const sel=$('service'); sel.innerHTML='';
  j.services.forEach(s=>{
    const o=document.createElement('option'); o.value=s.key;
    o.textContent=`${s.title} ${s.available?'✓':'✗'}`;
    if(!s.available) o.disabled=true;
    sel.appendChild(o);
  });
  put(`&gt; loaded ${j.services.length} services`,'text-cyan-300');
}
$('reloadSvc').onclick=loadServices;

$('buffBtn').onclick=async ()=>{
  const service=$('service').value, url=$('url').value.trim(), loops=parseInt($('loops').value)||1;
  if(!service||!url){ put('&gt; missing service/url','text-rose-300'); return; }
  showOv('QUEUEING…');
  try{
    const j=await api('/api/buff',{method:'POST',body:JSON.stringify({service,url,loops})});
    if(j.ok){ put(`&gt; queued ${j.queued} jobs`,'text-lime-300'); }
    else{ put('&gt; queue failed: '+(j.error||''),'text-rose-300'); }
  } finally { hideOv(); }
};

$('clearJobs').onclick=async ()=>{
  await api('/api/jobs/clear',{method:'POST'});
  state.jobsMap.clear(); renderJobs();
};

function renderJobs(){
  const arr=[...state.jobsMap.values()].sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  jobs.innerHTML='';
  let q=0,r=0,d=0;
  arr.forEach(j=>{
    if(j.status==='queued') q++; else if(j.status==='running') r++; else if(j.status==='done') d++;
    const el=document.createElement('div');
    el.className='rounded-lg border border-white/10 bg-black/40 p-2';
    el.innerHTML=`
      <div class="flex items-center justify-between">
        <div class="font-mono text-[11px] truncate max-w-[140px]">${j.service||''}</div>
        <span class="pill pill-${j.status}">${(j.status||'').toUpperCase()}</span>
      </div>
      <div class="mt-1 font-mono text-[10px] text-slate-500 truncate">${j.url||''}</div>`;
    jobs.appendChild(el);
  });
  $('statQ').textContent=q; $('statR').textContent=r; $('statD').textContent=d;
}

async function refreshJobs(){
  const j=await api('/api/jobs'); if(!j.ok) return;
  state.jobsMap.clear();
  j.jobs.forEach(x=>state.jobsMap.set(x.id,x));
  renderJobs();
}

function connectStream(){
  const es=new EventSource('/api/stream');
  const dot=$('connDot');
  es.addEventListener('hello',()=>{ dot.innerHTML='<span class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399] animate-pulse"></span><span class="chip text-[10px] text-emerald-300">LINK</span>'; });
  es.onmessage=(e)=>{
    try{
      const ev=JSON.parse(e.data);
      if(ev.type==='job_queued'||ev.type==='job_update'){
        state.jobsMap.set(ev.job.id, ev.job);
        renderJobs();
        if(ev.type==='job_update' && ev.job.status==='done')  put(`&gt; job ${ev.job.id} done`,'text-emerald-300');
        if(ev.type==='job_update' && ev.job.status==='error') put(`&gt; job ${ev.job.id} error: ${ev.job.error||''}`,'text-rose-300');
      }
    }catch(x){}
  };
  es.onerror=()=>{ dot.innerHTML='<span class="h-2 w-2 rounded-full bg-rose-400 animate-pulse"></span><span class="chip text-[10px] text-rose-300">DROP</span>'; setTimeout(connectStream, 3000); es.close(); };
}

put('&gt; terminal ready. Press INITIALIZE to link session.','text-cyan-300');
refreshJobs(); connectStream();
</script>
</body>
</html>
