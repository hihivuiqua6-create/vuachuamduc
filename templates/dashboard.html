<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>COMMAND DECK — Zefoy Buff Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="mmo-bg"></div>
  <div class="mmo-grid"></div>
  <div class="mmo-scanlines"></div>

  <!-- boot overlay -->
  <div class="boot-overlay" id="boot">
    <div class="hud-title" style="color:var(--cyan);letter-spacing:.35em;font-size:14px">INITIALIZING&nbsp;GRID</div>
    <div class="boot-bar"><i></i></div>
    <div style="font-size:10px;color:var(--ink-mute);letter-spacing:.25em">LOADING ASSETS · SYNCING NODES</div>
  </div>

  <!-- Header -->
  <header style="position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);
    background:linear-gradient(180deg,rgba(4,6,12,.85),rgba(4,6,12,.5));
    border-bottom:1px solid var(--line)">
    <div style="max-width:1240px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:36px;height:36px;border:1px solid var(--cyan);border-radius:8px;
          background:linear-gradient(180deg,rgba(34,211,238,.18),transparent);
          display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-cyan)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2.2">
            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="hud-title" style="font-size:14px;color:var(--ink)">ZEFOY · COMMAND DECK</div>
          <div style="font-size:10px;color:var(--ink-mute);letter-spacing:.22em">NODE 01 · SESSION ACTIVE</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="hud-chip"><span class="hud-dot cyan"></span> KEY {{ user.id }}</span>
        <span class="hud-chip" id="statusChip"><span class="hud-dot warn" id="statusDot"></span> <span id="statusText">IDLE</span></span>
        <button id="logoutBtn" class="btn-ghost">LOGOUT</button>
      </div>
    </div>
  </header>

  <main style="max-width:1240px;margin:0 auto;padding:24px 22px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)">

    <!-- LEFT: Captcha node -->
    <section class="hud-panel" style="padding:22px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="hud-title" style="font-size:12px;color:var(--cyan)">▚ CAPTCHA&nbsp;NODE</div>
        <button id="initBtn" class="btn-ghost" style="padding:6px 10px;font-size:10px">INIT&nbsp;SESSION</button>
      </div>

      <div style="aspect-ratio:3/1;border:1px dashed var(--line-2);border-radius:8px;
        background:radial-gradient(circle at center,rgba(34,211,238,.06),transparent 70%),rgba(3,6,12,.7);
        display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
        <img id="captchaImg" style="max-height:100%;display:none" />
        <span id="captchaPh" style="font-size:10px;letter-spacing:.28em;color:var(--ink-mute)">▧ NO&nbsp;CAPTCHA&nbsp;LOADED</span>
      </div>

      <div style="margin-top:12px;display:grid;gap:10px">
        <button id="getCap" class="btn-ghost" style="padding:11px">▶ FETCH&nbsp;CAPTCHA</button>
        <div style="display:flex;gap:8px">
          <input id="capAnswer" class="field" placeholder="ANSWER" style="text-transform:uppercase;letter-spacing:.2em" />
          <button id="solveBtn" class="btn-mmo" style="min-width:110px">SOLVE</button>
        </div>
      </div>

      <div style="margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-size:10px;color:var(--ink-mute);letter-spacing:.22em;line-height:1.8">
        <div>▸ SESSION&nbsp;INTEGRITY&nbsp;: <span style="color:var(--ok)">SEALED</span></div>
        <div>▸ REGION&nbsp;: ASIA-SE / SGN</div>
        <div>▸ RUNTIME&nbsp;: FLASK · py3.13</div>
      </div>
    </section>

    <!-- RIGHT: Buff console -->
    <section class="hud-panel" style="padding:22px">
      <div class="hud-title" style="font-size:12px;color:var(--cyan);margin-bottom:16px">▚ BUFF&nbsp;CONSOLE</div>

      <div style="display:grid;gap:14px;grid-template-columns:1fr 1fr">
        <div>
          <label style="display:block;font-size:10px;letter-spacing:.24em;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase">Service</label>
          <div style="display:flex;gap:8px">
            <select id="service" class="field" style="flex:1"><option value="">— LOAD SERVICES —</option></select>
            <button id="refreshSvc" class="btn-ghost" style="padding:0 12px">↻</button>
          </div>
        </div>
        <div>
          <label style="display:block;font-size:10px;letter-spacing:.24em;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase">TikTok&nbsp;URL</label>
          <input id="ttUrl" class="field" placeholder="https://www.tiktok.com/@user/video/..." />
        </div>
      </div>

      <button id="buffBtn" class="btn-mmo" style="width:100%;margin-top:18px;padding:14px;font-size:13px">
        ⚡ EXECUTE&nbsp;BUFF
      </button>

      <div style="margin-top:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div class="hud-title" style="font-size:11px;color:var(--ink-dim)">▚ EVENT&nbsp;LOG</div>
          <button id="clearLog" class="btn-ghost" style="padding:4px 8px;font-size:10px">CLEAR</button>
        </div>
        <div class="log-box" id="log"></div>
      </div>
    </section>
  </main>

<script>
window.addEventListener('load',()=>setTimeout(()=>document.getElementById('boot').classList.add('hide'),900));
const $=id=>document.getElementById(id);
const logEl=$('log');
function log(msg,cls='info'){
  const t=new Date().toLocaleTimeString();
  const line=document.createElement('div');line.className='log-line '+cls;
  line.innerHTML=`<span class="log-time">[${t}]</span>${msg}`;
  logEl.appendChild(line);logEl.scrollTop=logEl.scrollHeight;
}
function setStatus(text,dot){
  $('statusText').textContent=text;
  $('statusDot').className='hud-dot '+dot;
}
async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});return r.json();
}
$('logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST'});location='/login';};
$('clearLog').onclick=()=>logEl.innerHTML='';

$('initBtn').onclick=async()=>{
  setStatus('INIT…','cyan');log('▸ Khởi tạo phiên Zefoy…','info');
  const j=await api('/api/init',{method:'POST'});
  if(j.ok){log('✓ Init OK','ok');setStatus('READY','cyan');}
  else{log('✕ Init lỗi: '+(j.error||''),'err');setStatus('ERROR','err');}
};
$('getCap').onclick=async()=>{
  log('▸ Fetching captcha…','info');
  const j=await api('/api/captcha');
  if(j.ok){$('captchaImg').src=j.image;$('captchaImg').style.display='block';$('captchaPh').style.display='none';log('✓ Captcha loaded','ok');}
  else log('✕ '+(j.error||''),'err');
};
$('solveBtn').onclick=async()=>{
  const ans=$('capAnswer').value.trim();if(!ans)return;
  log('▸ Solving: '+ans,'info');
  const j=await api('/api/solve',{method:'POST',body:JSON.stringify({answer:ans})});
  if(j.ok){log('✓ Captcha correct','ok');setStatus('AUTHED','cyan');loadServices();}
  else{log('✕ Captcha wrong','err');}
};
async function loadServices(){
  const j=await api('/api/services');if(!j.ok){log('✕ Services: '+(j.error||''),'err');return;}
  const sel=$('service');sel.innerHTML='<option value="">— SELECT SERVICE —</option>';
  (j.services||[]).forEach(s=>{const o=document.createElement('option');o.value=s.key||s.name;o.textContent=(s.name||s.key)+(s.status?` [${s.status}]`:'');sel.appendChild(o);});
  log(`✓ ${j.services.length} services loaded`,'ok');
}
$('refreshSvc').onclick=loadServices;
$('buffBtn').onclick=async()=>{
  const service=$('service').value,url=$('ttUrl').value.trim();
  if(!service||!url){log('! Chọn service và nhập URL','warn');return;}
  log(`⚡ BUFF ${service} → ${url}`,'info');setStatus('BUFFING','cyan');
  const j=await api('/api/buff',{method:'POST',body:JSON.stringify({service,url})});
  if(j.ok){log('✓ '+JSON.stringify(j.result),'ok');setStatus('READY','cyan');}
  else{log('✕ '+(j.error||''),'err');setStatus('ERROR','err');}
};
</script>
</body>
</html>
