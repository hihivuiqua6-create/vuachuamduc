<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ACCESS TERMINAL — Zefoy Buff Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="mmo-bg"></div>
  <div class="mmo-grid"></div>
  <div class="mmo-scanlines"></div>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="width:100%;max-width:440px">

      <!-- Top HUD strip -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:10px;color:var(--ink-mute);letter-spacing:.2em;text-transform:uppercase">
        <span>SYS::AUTH-NODE / v2.0</span>
        <span class="hud-chip"><span class="hud-dot cyan"></span> ONLINE</span>
      </div>

      <div class="hud-panel" style="padding:32px 30px">
        <div style="text-align:center;margin-bottom:26px">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;
                      border:1px solid var(--cyan);border-radius:12px;
                      background:linear-gradient(180deg,rgba(34,211,238,.15),transparent);
                      box-shadow:var(--shadow-cyan);margin-bottom:14px">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2">
              <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="hud-title" style="margin:0;font-size:22px;color:var(--ink)">ZEFOY&nbsp;BUFF&nbsp;PANEL</h1>
          <div style="font-size:10px;letter-spacing:.3em;color:var(--cyan);margin-top:6px">TIKTOK · AUTOMATION · GRID</div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
          <span style="flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)"></span>
          <span class="hud-chip">SECURE&nbsp;LOGIN</span>
          <span style="flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)"></span>
        </div>

        <form id="loginForm" autocomplete="off">
          <label style="display:block;font-size:10px;letter-spacing:.24em;color:var(--ink-dim);margin-bottom:8px;text-transform:uppercase">Access&nbsp;Key</label>
          <input id="key" class="field" placeholder="XXXX-XXXX-XXXX-XXXX" required style="letter-spacing:.15em" />
          <button type="submit" class="btn-mmo" style="width:100%;margin-top:18px;padding:13px">
            <span id="btnTxt">ENGAGE&nbsp;·&nbsp;LOGIN</span>
          </button>
          <p id="err" style="display:none;color:var(--err);font-size:11.5px;margin-top:12px;text-align:center"></p>
        </form>
      </div>

      <div style="text-align:center;margin-top:20px;font-size:10px;color:var(--ink-mute);letter-spacing:.2em">
        © DEV&nbsp;AUZA · ALL&nbsp;NODES&nbsp;RESERVED
      </div>
    </div>
  </div>

<script>
const form=document.getElementById('loginForm');
const err=document.getElementById('err');
const btnTxt=document.getElementById('btnTxt');
form.addEventListener('submit',async e=>{
  e.preventDefault();err.style.display='none';
  const key=document.getElementById('key').value.trim();
  const btn=form.querySelector('button');btn.disabled=true;
  btnTxt.innerHTML='<span class="mmo-loader"></span>&nbsp;&nbsp;VERIFYING';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const j=await r.json();
    if(j.ok){btnTxt.textContent='ACCESS GRANTED';location='/dashboard';}
    else{err.textContent='✕ '+(j.error||'Key không hợp lệ');err.style.display='block';btnTxt.textContent='ENGAGE · LOGIN';btn.disabled=false;}
  }catch(x){err.textContent='✕ Lỗi kết nối';err.style.display='block';btnTxt.textContent='ENGAGE · LOGIN';btn.disabled=false;}
});
</script>
</body>
</html>
