<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng nhập · Python Guard</title>
<link rel="stylesheet" href="/static/app.css" />
</head>
<body class="auth">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">🛡️</div>
      <h1>Python Guard</h1>
      <p>Đóng gói & mã hoá Python trên cloud</p>
    </div>
    <form method="post" action="/login" class="stack">
      <label>Tên đăng nhập
        <input name="username" required autocomplete="username" autofocus />
      </label>
      <label>Mật khẩu
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      {% if error %}<div class="error">Sai tên đăng nhập hoặc mật khẩu</div>{% endif %}
      <button class="btn primary" type="submit">Đăng nhập →</button>
    </form>
    <p class="hint">Mặc định: <code>admin / admin123</code> — đổi trong biến môi trường Render.</p>
  </div>
</body>
</html>
