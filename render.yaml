services:
  - type: web
    name: tienbuff
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /tmp/tienbuff_data
      - key: FREE_DAILY_LIMIT
        value: "10"