services:
  - type: web
    name: tiendev-buff
    env: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends tesseract-ocr || true
      pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
