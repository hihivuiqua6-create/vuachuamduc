services:
  - type: web
    name: buff-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 -k gthread --threads 8 -t 120 -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: ADMIN_KEY
        value: mducdeptrai
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
