services:
  - type: web
    name: zefoy-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        value: 8704711376:AAHkrYeCYUoZkmSDHC5UjLHtJAc5XGC_ae4
      - key: TELEGRAM_CHANNEL_LINK
        value: https://t.me/+uH22KBhxe51jYjM1
      - key: ADMIN_IDS
        value: 8030294480
      - key: API_URL
        value: https://vuachuamduc.onrender.com

  - type: worker
    name: zefoy-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        value: 8122755073:AAHrE1SxUJbG4-K55tw8f_yHH1DBDp2N-xg
      - key: TELEGRAM_CHANNEL_LINK
        value: https://t.me/+uH22KBhxe51jYjM1
      - key: ADMIN_IDS
        value: 6214458926
      - key: API_URL
        value: https://vuachuamduc.onrender.com
